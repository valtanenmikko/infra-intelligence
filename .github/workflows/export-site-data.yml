# Daily export of Gold tables to site/data/site.json, after the Databricks job (10:30 Europe/Helsinki).
name: export-site-data

on:
  # The Databricks job dispatches this workflow when it finishes (notebook 07). The cron is a backup only: GitHub
  # often runs it hours late or skips it, especially on the hour. UTC.
  schedule:
    - cron: "17 9 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-site-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Backup runs stop here once today's data is out, so they don't spend the Free Edition compute quota.
      - name: Skip if already exported today
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          if grep -q "\"generated_at\": \"$(date -u +%F)\"" site/data/site.json; then
            echo "Already exported today"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: pip install requests

      - name: Unit tests
        if: steps.fresh.outputs.skip != 'true'
        run: python -m unittest discover -s tests -t .

      - name: Export Gold tables
        if: steps.fresh.outputs.skip != 'true'
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: python scripts/export_site_data.py

      - name: Commit if data changed
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/data/site.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): refresh site data"
            git push
          fi
