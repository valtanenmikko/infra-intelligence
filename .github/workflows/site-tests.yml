# Browser tests for the site (page behaviour, accessibility, bid portfolio maths) on every site or test change.
# Data refresh commits by the export bot do not trigger it (GITHUB_TOKEN pushes start no workflows).
name: site-tests

on:
  push:
    branches: [main]
    paths: ["site/**", "tests/test_site.py", ".github/workflows/site-tests.yml"]
  pull_request:
    paths: ["site/**", "tests/test_site.py", ".github/workflows/site-tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser tests
        run: python -m unittest tests.test_site -v
